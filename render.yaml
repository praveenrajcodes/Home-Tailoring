services:
  - type: web
    name: stitchcraft-app
    env: node
    plan: free
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      # Neon connection string: set this by hand in the Render dashboard
      # (Environment tab). It is NOT stored in Git.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
