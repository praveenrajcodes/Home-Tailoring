databases:
  - name: stitchcraft-db
    plan: free
    databaseName: stitchcraft
    user: stitchcraft

services:
  - type: web
    name: stitchcraft-app
    env: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stitchcraft-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
